# Porta HTTP da API: em producao (ex.: Render), a plataforma define PORT
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:${API_PORT:8080}}

# Le de variavel de ambiente, com valor padrao para desenvolvimento
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/palpitearena}

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Libera CORS para permitir chamadas do front-end mesmo quando aberto em outra porta
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# OpenAPI gerado do codigo: JSON/YAML em /q/openapi e interface em /q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
# Mantem a Swagger UI tambem no jar/container (por padrao so existe em dev e test)
quarkus.swagger-ui.always-include=true

# Cliente gRPC para o microsservico Go de notificacoes (em texto puro na rede interna)
quarkus.grpc.clients.notificacao.host=${NOTIFICACAO_HOST:localhost}
quarkus.grpc.clients.notificacao.port=${NOTIFICACAO_PORT:8081}
quarkus.grpc.clients.notificacao.plain-text=true
quarkus.grpc.server.use-separate-server=false

# Nos testes (@QuarkusTest), usa porta HTTP aleatoria para nao conflitar com o container Go (8081) quando o compose estiver rodando
%test.quarkus.http.test-port=0
%test.quarkus.grpc.clients.notificacao.test-port=${NOTIFICACAO_PORT:8081}
