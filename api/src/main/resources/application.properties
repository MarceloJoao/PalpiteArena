# Le de variavel de ambiente, com valor padrao para desenvolvimento
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USER:postgres}
quarkus.datasource.password=${DATABASE_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/palpitearena}

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# OpenAPI gerado do codigo: JSON/YAML em /q/openapi e interface em /q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
# Mantem a Swagger UI tambem no jar/container (por padrao so existe em dev e test)
quarkus.swagger-ui.always-include=true