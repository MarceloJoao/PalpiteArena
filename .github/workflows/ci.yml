name: CI

# Dispara em todo push ou Pull Request na branch main e branches de feature/sprint
on:
  push:
    branches: [main, "feature/**", "sprint-*", "sprint-**"]
  pull_request:
    branches: [main]

jobs:

  # Job 1: compila e testa a API Quarkus (Java) com banco real
  build-api:
    name: Build & Test API (Quarkus/Java)
    runs-on: ubuntu-latest

    # Sobe um PostgreSQL junto com o job para os testes de integracao
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: palpitearena_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Aguarda o banco estar pronto antes de iniciar os testes
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Dar permissao ao gradlew
      
        run: chmod +x api/gradlew

      - name: Compilar a API
        run: cd api && ./gradlew build -x test

      - name: Aplicar migracoes Flyway por comando (migrar)
        run: java -Dpalpitearena.migrar.apenas=true -Dquarkus.http.port=0 -jar api/build/quarkus-app/quarkus-run.jar
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/palpitearena_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      - name: Rodar os testes da API
        run: cd api && ./gradlew test
        env:
          # Aponta os testes para o banco do CI
          DATABASE_URL: jdbc:postgresql://localhost:5432/palpitearena_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

  # Job 2: valida o contrato Protobuf (buf lint) e testa o servico Go
  build-go:
    name: Lint Proto & Test Go Service
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Instalar Buf CLI
        run: |
          sudo curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.47.2/buf-Linux-x86_64" -o /usr/local/bin/buf
          sudo chmod +x /usr/local/bin/buf

      - name: Validar contrato Protobuf (buf lint)
        run: cd protos && buf lint

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "services/notificacao/go.mod"
          cache-dependency-path: "services/notificacao/go.sum"

      - name: Compilar o servico Go
        run: cd services/notificacao && go build ./...

      - name: Rodar os testes do servico Go
        run: cd services/notificacao && go test -v ./...

  # Job 3: na branch main, depois que todos os testes passam, publica as imagens no GHCR (Passo 18)
  publicar-imagens:
    name: Publish Docker Images (GHCR)
    needs: [build-api, build-go]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nome: notificacao
            contexto: services/notificacao
            dockerfile: services/notificacao/Dockerfile
          - nome: api
            contexto: .
            dockerfile: api/Dockerfile
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem (${{ matrix.nome }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/marcelojoao/palpitearena/${{ matrix.nome }}:${{ github.sha }}
            ghcr.io/marcelojoao/palpitearena/${{ matrix.nome }}:latest
